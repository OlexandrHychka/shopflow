name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm
      - name: Check repository structure
        run: |
          test -f AGENTS.md
          test -f docs/srs.md
          test -d openspec/specs
      - name: Validate OpenSpec specs
        run: npx -y @fission-ai/openspec@2.1.1 validate --specs --strict

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check

  unit-and-component:
    name: unit-and-component
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run API unit tests
        run: pnpm --filter @shopflow/api test:unit -- --reporter junit --outputFile $GITHUB_WORKSPACE/reports/vitest-api.xml
      - name: Run API component tests
        run: pnpm --filter @shopflow/api test:component -- --reporter junit --outputFile $GITHUB_WORKSPACE/reports/vitest-api-component.xml
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: reports/

  ui-component:
    name: ui-component
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Web UI component tests
        run: pnpm --filter @shopflow/web test -- --reporter junit --outputFile $GITHUB_WORKSPACE/reports/vitest-web.xml
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-reports
          path: reports/

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Start Compose stack
        run: docker compose -f infra/compose/docker-compose.yml up --build --detach --wait
      - name: Check container health
        run: |
          docker compose -f infra/compose/docker-compose.yml ps -q | xargs -I {} docker inspect --format '{{.Name}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' {}
      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p reports
          docker compose -f infra/compose/docker-compose.yml logs --no-color > reports/compose.log
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: reports/
      - name: Stop Compose stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start Compose stack
        run: docker compose -f infra/compose/docker-compose.yml up --build --detach --wait
      - name: Install Playwright Chromium
        run: pnpm --filter @shopflow/e2e exec playwright install --with-deps chromium
      - name: Run E2E smoke test
        run: pnpm --filter @shopflow/e2e test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
      - name: Stop Compose stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  ci-ok:
    name: ci-ok
    if: always()
    needs: [smoke, lint, unit-and-component, ui-component, compose-smoke, e2e-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail if a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
