name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check repository structure
        run: |
          test -f AGENTS.md
          test -f docs/srs.md
          test -d openspec/specs
      - name: Validate OpenSpec specs
        run: npx -y @fission-ai/openspec@latest validate --specs --strict

  ci-ok:
    name: ci-ok
    if: always()
    needs: [smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1