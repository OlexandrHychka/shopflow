services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopflow}
      POSTGRES_DB: ${POSTGRES_DB:-shopflow}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-shopflow} -d ${POSTGRES_DB:-shopflow}']
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - '9092:9092'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092',
        ]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - '8025:8025'
      - '1025:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-shopflow}:${POSTGRES_PASSWORD:-shopflow}@postgres:5432/${POSTGRES_DB:-shopflow}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - '${API_PORT:-3001}:${API_PORT:-3001}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:${API_PORT:-3001}/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      PORT: ${WEB_PORT:-3000}
    ports:
      - '${WEB_PORT:-3000}:${WEB_PORT:-3000}'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:${WEB_PORT:-3000}/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 5

volumes:
  postgres-data:
